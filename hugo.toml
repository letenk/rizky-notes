# ===================================
# BASIC SETTINGS
# ===================================
baseURL = 'https://rizkynotes.com/'
defaultContentLanguage = 'id'
defaultContentLanguageInSubdir = false
# `languageCode` and `title` are moved into [languages] (per-language)

# ===================================
# BUILD SETTINGS
# ===================================
[build]
  writeStats = true

# ===================================
# MARKUP SETTINGS
# ===================================
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.highlight]
    style = 'monokai' # ref: https://xyproto.github.io/splash/docs/
    lineNos = false

# ===================================
# GLOBAL PARAMS (language-neutral, shared by both languages)
# ===================================
[params]
  author = 'Rizky Darmawan'

   # Default OG Image (for homepage & pages without image)
  image = '/images/og-image.png'

  # Social Media
  [params.social]
    instagram = 'https://www.instagram.com/rizky.notes/'
    github = 'https://github.com/letenk'
    linkedin = 'https://www.linkedin.com/in/rizkydarmawan/'

  # Comments - Giscus
  [params.giscus]
    repo       = "letenk/rizky-notes"
    repoId     = "R_kgDOQobt5g"
    category   = "Announcements"
    categoryId = "DIC_kwDOQobt5s4C0Py1"

# ===================================
# LANGUAGES (multilingual: ID at root, EN under /en/)
# ===================================
[languages]
  [languages.id]
    languageCode      = 'id-ID'
    languageName      = 'Bahasa Indonesia'
    languageDirection = 'ltr'
    contentDir        = 'content'
    weight            = 1
    title             = "Rizky Note's"
    [languages.id.params]
      description = 'Rizky Note’s adalah tempat saya menuliskan catatan pribadi seputar Software Engineering, terutama tentang Backend Engineering. Ditulis untuk diri sendiri, dibagikan untuk siapa saja.'
      ogLocale    = 'id_ID'
    [languages.id.menus]
      [[languages.id.menus.main]]
        name    = 'Beranda'
        pageRef = '/'
        weight  = 1
      [[languages.id.menus.main]]
        name    = 'Artikel'
        pageRef = '/posts'
        weight  = 2
      [[languages.id.menus.main]]
        name    = 'Portfolio'
        pageRef = '/portfolio'
        weight  = 3
      [[languages.id.menus.main]]
        name    = 'Tentang'
        pageRef = '/about'
        weight  = 4

  [languages.en]
    languageCode      = 'en-US'
    languageName      = 'English'
    languageDirection = 'ltr'
    contentDir        = 'content'
    weight            = 2
    title             = "Rizky Note's"
    [languages.en.params]
      description = 'Notes on software engineering — mostly backend, Go, and production systems. Written for myself, shared with anyone.'
      ogLocale    = 'en_US'
    [languages.en.menus]
      [[languages.en.menus.main]]
        name    = 'Home'
        pageRef = '/'
        weight  = 1
      [[languages.en.menus.main]]
        name    = 'Blog'
        pageRef = '/posts'
        weight  = 2
      [[languages.en.menus.main]]
        name    = 'Portfolio'
        pageRef = '/portfolio'
        weight  = 3
      [[languages.en.menus.main]]
        name    = 'About'
        pageRef = '/about'
        weight  = 4

# ===================================
# OUTPUTS
# ===================================
[outputs]
  home = ['HTML', 'RSS', 'JSON']
  section = ['HTML', 'RSS']

# ===================================
# SITEMAP CONFIGURATION
# ===================================
[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

# ===================================
# TAXONOMIES
# ===================================
[taxonomies]
  tag = 'tags'
  category = 'categories'

# ===================================
# PRIVACY & SECURITY
# ===================================
[privacy]
  [privacy.googleAnalytics]
    anonymizeIP = true
    respectDoNotTrack = true

# ===================================
# SECURITY
# ===================================
[security]
  [security.funcs]
    getenv = ['^HUGO_', '^CI$', '^GOOGLE_ANALYTICS_ID$']

# ===================================
# PERMALINKS
# ===================================
[permalinks]
  posts = '/posts/:slug/'

[minify]
  disableHTML = false
  disableJSON = false
  disableXML = false
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepQuotes = false
      keepWhitespace = false
